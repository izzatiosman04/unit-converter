<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProConvert | Engineering Unit Converter</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Engineering Unit Converter</h1>
            <p>Precise conversions for professional workflows.</p>
        </header>

        <main class="converter-card">
            <div class="input-group">
                <label for="category">Conversion Type</label>
                <select id="category">
                    <option value="length">Length</option>
                    <option value="mass">Mass</option>
                    <option value="temp">Temperature</option>
                </select>
            </div>

            <div class="conversion-grid">
                <div class="input-field">
                    <input type="number" id="inputValue" placeholder="0.00">
                    <select id="fromUnit"></select>
                </div>
                
                <div class="equals">=</div>

                <div class="input-field">
                    <input type="number" id="outputValue" readonly placeholder="0.00">
                    <select id="toUnit"></select>
                </div>
            </div>

            <button id="saveBtn" class="secondary-btn">Save Conversion</button>
        </main>

        <section class="saved-section">
            <h3>Recent Conversions</h3>
            <ul id="savedList"></ul>
        </section>
    </div>
    <script src="script.js"></script>
</body>
</html>
